[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-video-manager"
version = "0.1.0"
description = "개인용 영상 라이브러리"
requires-python = ">=3.10"
dependencies = ["PySide6==6.10.2", "python-mpv==1.0.8", "faster-whisper==1.2.1", "ctranslate2==4.8.3", "huggingface-hub>=0.21,<3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
cuda = ["nvidia-cublas-cu12==12.8.4.1; sys_platform == 'win32'", "nvidia-cudnn-cu12==9.8.0.87; sys_platform == 'win32'"]

[project.scripts]
my-video-manager = "my_video_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
my_video_manager = ["theme_icons/*.svg", "web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
