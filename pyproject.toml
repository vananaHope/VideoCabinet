[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-video-manager"
version = "0.6.0"
description = "개인용 영상 라이브러리"
requires-python = ">=3.10"
dependencies = ["PySide6==6.10.2", "python-mpv==1.0.8", "faster-whisper==1.2.1", "ctranslate2==4.8.3", "huggingface-hub>=0.21,<3", "cryptography==50.0.2", "watchdog==6.0.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-xdist==3.8.0"]
build = ["pyinstaller==6.16.0", "tomli>=2; python_version < '3.11'"]
cuda = ["nvidia-cublas-cu12==12.8.4.1; sys_platform == 'win32'", "nvidia-cudnn-cu12==9.8.0.87; sys_platform == 'win32'"]
# 설치판 다운로드의 같은 버전 URL/SHA-256은 runtime_assets.py에 고정한다.

[project.scripts]
my-video-manager = "my_video_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
my_video_manager = ["web_tokens.json", "web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
