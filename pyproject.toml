[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-video-manager"
version = "0.1.0"
description = "개인용 영상 라이브러리"
requires-python = ">=3.10"
dependencies = ["PySide6==6.10.2", "python-mpv==1.0.8"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
my-video-manager = "my_video_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
