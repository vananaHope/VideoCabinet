# 웹 셸(frontend/)의 lint와 typecheck를 돌린다. 빌드는 Windows tests가 테스트 준비로 이미 하므로 여기서는 하지 않는다.
# Windows 러너를 기다리지 않도록 Linux 러너에서 따로 돈다. 브리지 타입 생성 결과도 frontend/src에 있어 이 경로로 잡힌다.
name: Frontend checks

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck:
    name: lint · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: lint
        run: npm run lint

      - name: typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck
