# 임시: #426 대화상자 오프스크린 검사를 Windows 러너에서 돌리고 화면을 올린다. 병합 전에 지운다.
name: tmp check web dialogs
on:
  push:
    branches: [claude/project-thread-0h6v61]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - shell: pwsh
        run: |
          uv venv --python (python -c "import sys; print(sys.executable)") .venv
          uv pip install --python .venv/Scripts/python.exe -e '.[dev]'
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - shell: pwsh
        run: |
          .venv/Scripts/python.exe scripts/install_libmpv.py
          New-Item -ItemType Directory -Force .local | Out-Null
          New-Item -ItemType Directory -Force shots | Out-Null
          $env:QT_QPA_PLATFORM = 'offscreen'
          .venv/Scripts/python.exe scripts/check_web_dialogs.py --offscreen --output shots
          if ($LASTEXITCODE -ne 0) { throw "check_web_dialogs 실패 ($LASTEXITCODE)" }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots
