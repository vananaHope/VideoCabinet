# 임시 진단(#392): Windows 러너에서 백업 offscreen 검사를 돌린다.
name: Diag backup check
on:
  pull_request:
  workflow_dispatch:
jobs:
  backup:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ref: ['HEAD', '531a031^']
        defender: ['off', 'on']
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - if: matrix.defender == 'off'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 대상 코드
        shell: pwsh
        run: |
          Copy-Item .github/diag/patch.py $env:RUNNER_TEMP/patch.py
          if ('${{ matrix.ref }}' -ne 'HEAD') { git checkout '${{ matrix.ref }}' -- src scripts frontend pyproject.toml }
          python $env:RUNNER_TEMP/patch.py
          git log -1 --format=%h '${{ matrix.ref }}'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Python 환경
        shell: pwsh
        run: |
          uv venv --python (python -c "import sys; print(sys.executable)") .venv
          uv pip install --python .venv/Scripts/python.exe -e '.[dev]'
          .venv/Scripts/python.exe scripts/install_libmpv.py
      - name: 웹 셸 빌드
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: 폰트 확인
        shell: pwsh
        run: Get-ChildItem $env:WINDIR\Fonts\malgun*
      - name: 백업 검사
        shell: pwsh
        run: |
          foreach ($i in 1..5) {
            .venv/Scripts/python.exe scripts/check_web_backup.py --offscreen --output .local/screens-$i
            "EXIT $i = $LASTEXITCODE"
          }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-screens-${{ matrix.defender }}-${{ strategy.job-index }}
          path: .local/
